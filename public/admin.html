<!DOCTYPE html>
<html>
<head>
    <title>IronRealm Admin Dashboard</title>
    <style>
        body { background: #111; color: #eee; font-family: sans-serif; padding: 20px; }
        h1 { color: #5a5; border-bottom: 2px solid #333; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #222; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #333; color: #5a5; }
        tr:hover { background: #2a2a2a; }
        .error { color: #ff4d4d; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <h1>🛡️ IronRealm Admin Dashboard</h1>
    <div id="error-box" class="error"></div>
    <table id="player-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Level</th>
                <th>Gold</th>
                <th>Health</th>
                <th>Position</th>
            </tr>
        </thead>
        <tbody id="player-list"></tbody>
    </table>

    <script>
        const token = localStorage.getItem('ir_token');

        async function loadPlayers() {
            try {
                const res = await fetch('/api/admin/players', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    document.getElementById('error-box').style.display = 'block';
                    document.getElementById('error-box').innerText = "Access Denied: " + errorData.error;
                    return;
                }

                const players = await res.json();
                const list = document.getElementById('player-list');
                list.innerHTML = '';

                players.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${p.username}</strong></td>
                        <td>${p.role}</td>
                        <td>${p.stats.level}</td>
                        <td>💰 ${p.stats.gold}</td>
                        <td>❤️ ${p.stats.hp} / ${p.stats.maxHp}</td>
                        <td>X: ${p.stats.pos.x.toFixed(1)}, Z: ${p.stats.pos.z.toFixed(1)}</td>
                    `;
                    list.appendChild(tr);
                });
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        if (!token) {
            alert("No login found. Go to login page first.");
            window.location.href = "/";
        } else {
            loadPlayers();
            setInterval(loadPlayers, 5000);
        }
    </script>
</body>
</html>
