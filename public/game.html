<script>
    const token = localStorage.getItem('ir_token');
    // We need to decode the token to know who "we" are for the HP bar
    const myUsername = JSON.parse(atob(token.split('.')[1])).username;
    
    const socket = io({ auth: { token } });
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040, 0.6));

    // Green Grass Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshPhongMaterial({color: 0x2d5a27}));
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    const meshes = { players: {}, resources: {}, monsters: {} };

    // --- 3D Model Builders ---

    function createSword() {
        const group = new THREE.Group();
        // Blade
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.8, 0.05), new THREE.MeshPhongMaterial({color: 0xcccccc}));
        blade.position.y = 0.4;
        group.add(blade);
        // Handle
        const handle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), new THREE.MeshPhongMaterial({color: 0x442200}));
        handle.position.y = -0.1;
        group.add(handle);
        return group;
    }

    function createPlayerMesh(color = 0x3366ff) {
        const group = new THREE.Group();
        // Body
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), new THREE.MeshPhongMaterial({color: color}));
        body.position.y = 0.6;
        group.add(body);
        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({color: 0xffdbac}));
        head.position.y = 1.45;
        group.add(head);
        // Add Sword to hand
        const sword = createSword();
        sword.position.set(0.5, 0.6, 0.2);
        sword.rotation.x = Math.PI/4;
        group.add(sword);
        return group;
    }

    function createMonsterMesh(type) {
        const group = new THREE.Group();
        const color = type === 'ogre' ? 0xaa5533 : 0x8899aa;
        const size = type === 'ogre' ? 1.5 : 0.8;
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshPhongMaterial({color: color}));
        body.position.y = size/2;
        group.add(body);
        
        // Red glowing eyes
        const eyeGeo = new THREE.BoxGeometry(0.2, 0.1, 0.1);
        const eyeMat = new THREE.MeshBasicMaterial({color: 0xff0000});
        const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
        eye1.position.set(size/4, size*0.7, size/2);
        group.add(eye1);
        const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
        eye2.position.set(-size/4, size*0.7, size/2);
        group.add(eye2);
        
        return group;
    }

    // --- Socket Updates ---

    socket.on('state', (state) => {
        // Update Players
        state.players.forEach(p => {
            if (!meshes.players[p.username]) {
                meshes.players[p.username] = createPlayerMesh(p.username === myUsername ? 0x3366ff : 0xcc3333);
                scene.add(meshes.players[p.username]);
            }
            const mesh = meshes.players[p.username];
            mesh.position.set(p.x, 0, p.z);
            mesh.userData.isGathering = p.isGathering;

            // FIX: Update HP for the local player
            if (p.username === myUsername) {
                document.getElementById('hp').innerHTML = `
                    <div style="font-size: 20px; font-weight: bold; color: #ff4444;">
                        ❤️ HP: ${Math.round(p.hp)} / ${p.maxHp}
                    </div>
                `;
            }
        });

        // Update Resources (Trees/Rocks)
        state.resources.forEach(res => {
            if (!meshes.resources[res.id]) {
                const geo = res.type === 'tree' ? new THREE.ConeGeometry(0.8, 2, 8) : new THREE.DodecahedronGeometry(0.7);
                const mat = new THREE.MeshPhongMaterial({color: res.type === 'tree' ? 0x228B22 : 0x808080});
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(res.x, res.type === 'tree' ? 1 : 0.3, res.z);
                mesh.userData = { id: res.id, type: 'resource' };
                scene.add(mesh);
                meshes.resources[res.id] = mesh;
            }
        });
    });

    // --- Input & Camera ---

    window.addEventListener('mousedown', (e) => {
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const ray = new THREE.Raycaster();
        ray.setFromCamera(mouse, camera);
        
        const intersects = ray.intersectObjects(scene.children);
        for(let hit of intersects) {
            if (hit.object.userData.type === 'resource') {
                return socket.emit('startGathering', hit.object.userData.id);
            }
        }
        
        const groundHit = ray.intersectObject(floor);
        if (groundHit[0]) socket.emit('move', {x: groundHit[0].point.x, z: groundHit[0].point.z});
    });

    function animate() {
        requestAnimationFrame(animate);
        
        // Camera follows local player
        if (meshes.players[myUsername]) {
            const p = meshes.players[myUsername].position;
            camera.position.set(p.x, p.y + 12, p.z + 8);
            camera.lookAt(p.x, p.y, p.z);
        }

        // Gather Animation (Swing Sword)
        const time = Date.now() * 0.01;
        for(let id in meshes.players) {
            const m = meshes.players[id];
            if (m.userData.isGathering) {
                m.rotation.y = Math.sin(time * 2) * 0.5;
            } else {
                m.rotation.y = 0;
            }
        }
        
        renderer.render(scene, camera);
    }
    animate();
</script>
