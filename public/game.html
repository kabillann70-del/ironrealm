<!DOCTYPE html>
<html>
<head>
    <title>IronRealm - Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* UI Overlay */
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            padding: 15px; background: rgba(0,0,0,0.6); 
            border-radius: 10px; border: 1px solid #555;
            color: white; pointer-events: none; min-width: 150px;
        }

        /* Gathering Progress Bar */
        #gather-ui { 
            position: absolute; bottom: 20%; left: 50%; 
            transform: translateX(-50%); display: none; 
            width: 250px; text-align: center; 
        }
        #bar-bg { width: 100%; height: 15px; background: #222; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #5a5; }
        
        #notice { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="hp">❤️ HP: Loading...</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 5px;">Click ground to move.<br>Click Trees/Rocks to gather.</div>
    </div>

    <div id="gather-ui">
        <div style="color:white; font-weight: bold; margin-bottom: 5px;">GATHERING...</div>
        <div id="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <div id="notice"></div>

    <script>
        // --- 1. Safety Check for Login ---
        const token = localStorage.getItem('ir_token');
        if (!token) {
            window.location.href = '/index.html';
        }

        let myUsername = "";
        try {
            // Decode the username from the token
            myUsername = JSON.parse(atob(token.split('.')[1])).username;
        } catch (e) {
            console.error("Token error:", e);
            window.location.href = '/index.html';
        }

        // --- 2. Setup Socket & Scene ---
        const socket = io({ auth: { token } });
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // Ground
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(150, 150), 
            new THREE.MeshPhongMaterial({color: 0x2d5a27})
        );
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        const meshes = { players: {}, resources: {} };

        // --- 3. Models Builders ---
        function createCharacter(color) {
            const group = new THREE.Group();
            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.4), new THREE.MeshPhongMaterial({color}));
            body.position.y = 0.55;
            group.add(body);
            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshPhongMaterial({color: 0xffdbac}));
            head.position.y = 1.3;
            group.add(head);
            // Sword
            const swordGroup = new THREE.Group();
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.7, 0.03), new THREE.MeshPhongMaterial({color: 0xcccccc}));
            blade.position.y = 0.35;
            swordGroup.add(blade);
            const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.05), new THREE.MeshPhongMaterial({color: 0x442200}));
            swordGroup.add(hilt);
            swordGroup.position.set(0.5, 0.6, 0.2);
            swordGroup.rotation.x = Math.PI/3;
            group.add(swordGroup);
            return group;
        }

        // --- 4. Game Logic ---
        socket.on('state', (state) => {
            state.players.forEach(p => {
                if (!meshes.players[p.username]) {
                    meshes.players[p.username] = createCharacter(p.username === myUsername ? 0x3366ff : 0xcc3333);
                    scene.add(meshes.players[p.username]);
                }
                const m = meshes.players[p.username];
                m.position.set(p.x, 0, p.z);
                m.userData.isGathering = p.isGathering;

                if (p.username === myUsername) {
                    document.getElementById('hp').innerHTML = `❤️ HP: ${Math.round(p.hp)} / ${p.maxHp}`;
                }
            });

            state.resources.forEach(res => {
                if (!meshes.resources[res.id]) {
                    const geo = res.type === 'tree' ? new THREE.ConeGeometry(0.7, 2, 8) : new THREE.DodecahedronGeometry(0.5);
                    const mat = new THREE.MeshPhongMaterial({color: res.type === 'tree' ? 0x1d3d1a : 0x666666});
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(res.x, res.type === 'tree' ? 1 : 0.25, res.z);
                    mesh.userData = { id: res.id, type: 'resource' };
                    scene.add(mesh);
                    meshes.resources[res.id] = mesh;
                }
            });
        });

        socket.on('gatheringStart', (data) => {
            document.getElementById('gather-ui').style.display = 'block';
            const fill = document.getElementById('bar-fill');
            fill.style.width = '0%';
            setTimeout(() => {
                fill.style.transition = `width ${data.duration}ms linear`;
                fill.style.width = '100%';
            }, 50);
        });

        socket.on('gatheringFinished', () => {
            document.getElementById('gather-ui').style.display = 'none';
            document.getElementById('bar-fill').style.transition = 'none';
            document.getElementById('bar-fill').style.width = '0%';
        });

        socket.on('notice', (msg) => {
            const n = document.getElementById('notice');
            n.innerText = msg;
            setTimeout(() => n.innerText = "", 2000);
        });

        // Click to Move / Gather
        window.addEventListener('mousedown', (e) => {
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster();
            ray.setFromCamera(mouse, camera);
            
            const hits = ray.intersectObjects(scene.children);
            for(let hit of hits) {
                if (hit.object.userData.type === 'resource') {
