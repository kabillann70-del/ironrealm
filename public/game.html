<!DOCTYPE html>
<html>
<head>
    <title>IronRealm MMO</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; padding: 15px; background: rgba(0,0,0,0.8); color: white; border-radius: 8px; pointer-events: none; }
        #inv-ui { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 220px; background: rgba(0,0,0,0.9); padding: 10px; display: none; border: 2px solid #555; pointer-events: all; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .slot { width: 45px; height: 45px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        #gather-ui { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); display: none; width: 250px; }
        #bar-bg { width: 100%; height: 10px; background: #111; border: 1px solid #fff; border-radius: 5px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #2ecc71; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="hp-txt" style="color:#ff4d4d; font-weight:bold;">❤️ HP: Loading...</div>
        <div id="gold-txt" style="color:#f1c40f;">💰 Gold: 0</div>
        <div style="font-size:10px; color:#777; margin-top:5px;">Press 'B' for Bag</div>
    </div>
    <div id="inv-ui">
        <div style="color:white; font-size:12px; font-weight:bold;">INVENTORY</div>
        <div id="inv-grid" class="grid"></div>
    </div>
    <div id="gather-ui">
        <div id="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <script>
        const token = localStorage.getItem('ir_token');
        if (!token) window.location.href = '/';
        const myUsername = JSON.parse(atob(token.split('.')[1])).username;

        const socket = io({ auth: { token } });
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 20, 10); scene.add(sun);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhongMaterial({color: 0x1b3016}));
        floor.rotation.x = -Math.PI/2; scene.add(floor);

        const meshes = { players: {}, resources: {} };

        function createPlayer(isMe) {
            const g = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.5), new THREE.MeshPhongMaterial({color: isMe ? 0x3498db : 0xe74c3c}));
            b.position.y = 0.7; g.add(b);
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({color: 0xffdbac}));
            h.position.y = 1.6; g.add(h);
            return g;
        }

        socket.on('state', (state) => {
            state.players.forEach(p => {
                if (!meshes.players[p.username]) {
                    meshes.players[p.username] = createPlayer(p.username === myUsername);
                    scene.add(meshes.players[p.username]);
                }
                const m = meshes.players[p.username];
                m.targetPos = new THREE.Vector3(p.x, 0, p.z);
                m.userData.isGathering = p.isGathering;
                if (p.username === myUsername) document.getElementById('hp-txt').innerText = `❤️ HP: ${Math.round(p.hp)} / ${p.maxHp}`;
            });
            state.resources.forEach(res => {
                if (!meshes.resources[res.id]) {
                    const mesh = new THREE.Mesh(
                        res.type === 'tree' ? new THREE.ConeGeometry(0.7, 2.5) : new THREE.DodecahedronGeometry(0.5),
                        new THREE.MeshPhongMaterial({color: res.type === 'tree' ? 0x145a32 : 0x7f8c8d})
                    );
                    mesh.position.set(res.x, res.type === 'tree' ? 1.25 : 0.25, res.z);
                    mesh.userData = { id: res.id, type: 'resource' };
                    scene.add(mesh); meshes.resources[res.id] = mesh;
                }
            });
        });

        socket.on('inventory', (data) => {
            document.getElementById('gold-txt').innerText = `💰 Gold: ${data.stats.gold}`;
            const grid = document.getElementById('inv-grid'); grid.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const item = data.inventory[i];
                const slot = document.createElement('div'); slot.className = 'slot';
                if (item) slot.innerText = item.icon || '📦';
                grid.appendChild(slot);
            }
        });

        socket.on('gatheringStart', (d) => {
            document.getElementById('gather-ui').style.display = 'block';
            const f = document.getElementById('bar-fill');
            f.style.transition = 'none'; f.style.width = '0%';
            setTimeout(() => { f.style.transition = `width ${d.duration}ms linear`; f.style.width = '100%'; }, 50);
        });
        socket.on('gatheringFinished', () => { document.getElementById('gather-ui').style.display = 'none'; });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'b') {
                const ui = document.getElementById('inv-ui');
                ui.style.display = ui.style.display === 'none' ? 'block' : 'none';
            }
        });

        window.addEventListener('mousedown', (e) => {
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster();
            ray.setFromCamera(mouse, camera);
            const hits = ray.intersectObjects(scene.children, true);
            for(let h of hits) {
                if(h.object.userData.type === 'resource') return socket.emit('startGathering', h.object.userData.id);
            }
            const ground = ray.intersectObject(floor);
            if(ground[0]) socket.emit('move', {x: ground[0].point.x, z: ground[0].point.z});
        });

        function animate() {
            requestAnimationFrame(animate);
            Object.values(meshes.players).forEach(m => {
                if (m.targetPos) m.position.lerp(m.targetPos, 0.2);
                if (m.userData.isGathering) m.rotation.y = Math.sin(Date.now() * 0.01) * 0.5;
                else m.rotation.y = 0;
            });
            if (meshes.players[myUsername]) {
                const p = meshes.players[myUsername].position;
                camera.position.set(p.x, p.y + 15, p.z + 10); camera.lookAt(p.x, p.y, p.z);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
