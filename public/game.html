<!DOCTYPE html>
<html>
<head>
    <title>IronRealm MMO</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui-top { position: absolute; top: 20px; left: 20px; padding: 15px; background: rgba(0,0,0,0.8); color: white; border-radius: 8px; border: 1px solid #444; pointer-events: none; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 10px; border: 2px solid #555; pointer-events: all; }
        .h-slot { width: 50px; height: 50px; background: #222; border: 2px solid #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .h-slot img { width: 85%; height: 80%; object-fit: contain; }
        #inv-ui { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 240px; background: rgba(0,0,0,0.9); padding: 15px; display: none; border: 2px solid #555; pointer-events: all; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .slot { width: 50px; height: 50px; background: #222; border: 2px solid #333; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .slot img { width: 100%; height: 100%; object-fit: contain; }
        #shop-ui { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.95); border: 2px solid #f1c40f; color: white; padding: 20px; display: none; pointer-events: all; border-radius: 12px; }
        .shop-btn { background: #5a5; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 5px; }
        #gather-ui { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); display: none; width: 250px; text-align: center; }
        #bar-bg { width: 100%; height: 12px; background: #111; border: 1px solid #fff; border-radius: 6px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #2ecc71; }
        #notice { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); color: #f1c40f; font-weight: bold; text-shadow: 2px 2px 2px #000; pointer-events: none; }
        
        .dmg-text { position: absolute; color: #ff4d4d; font-weight: bold; pointer-events: none; font-size: 20px; text-shadow: 1px 1px black; animation: rise 0.8s ease-out forwards; }
        @keyframes rise { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
    </style>
</head>
<body>
    <div id="ui-top">
        <div id="hp-txt" style="color:#ff4d4d; font-weight:bold; font-size: 18px;">❤️ HP: 100</div>
        <div id="gold-txt" style="color:#f1c40f; font-size: 16px; margin-top: 5px;">💰 Gold: 0</div>
    </div>
    <div id="hotbar"><div class="h-slot"><div id="slot-1"></div></div><div class="h-slot"></div><div class="h-slot"></div><div class="h-slot"></div><div class="h-slot"></div></div>
    <div id="inv-ui">
        <div style="color:white; font-size:12px; font-weight:bold; text-align: center;">BACKPACK</div>
        <div id="inv-grid" class="grid"></div>
        <button onclick="socket.emit('sellAll')" style="margin-top:15px; width:100%; background:#f1c40f; border:none; padding:8px; cursor:pointer; font-weight:bold;">💰 SELL MATERIALS</button>
        <button onclick="if(confirm('Clear Bag?')) socket.emit('clearInventory')" style="margin-top:5px; width:100%; background:red; color:white; border:none; padding:5px; cursor:pointer; font-size:10px;">🗑️ DISCARD ALL</button>
    </div>
    <div id="shop-ui">
        <div style="font-weight:bold; font-size:18px; margin-bottom:15px; color:#f1c40f; text-align:center;">VILLAGE SHOP</div>
        <button class="shop-btn" onclick="socket.emit('buyItem', 'wood_sword')">Buy Wood Sword (50g)</button>
        <button class="shop-btn" onclick="socket.emit('buyItem', 'novice_axe')">Buy Novice Axe (40g)</button>
        <button onclick="toggleShop()" style="margin-top:10px; width:100%; background:#444; border:none; color:white; padding:5px; cursor:pointer;">Close</button>
    </div>
    <div id="gather-ui"><div id="bar-bg"><div id="bar-fill"></div></div></div>
    <div id="notice"></div>

    <script>
        const token = localStorage.getItem('ir_token');
        if (!token) window.location.href = '/';
        const myUsername = JSON.parse(atob(token.split('.')[1])).username;
        const socket = io({ auth: { token } });
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(20, 40, 10); scene.add(sun);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshPhongMaterial({color: 0x1b3016})); floor.rotation.x = -Math.PI/2; scene.add(floor);

        const meshes = { players: {}, resources: {}, monsters: {} };

        // --- 3D Builders ---
        function createWeapon(type) {
            const group = new THREE.Group();
            if (type === 'sword') {
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.05), new THREE.MeshPhongMaterial({color: 0xcccccc}));
                blade.position.y = 0.4; group.add(blade);
                const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.1), new THREE.MeshPhongMaterial({color: 0x442200}));
                group.add(hilt);
            } else if (type === 'axe') {
                const handle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.08), new THREE.MeshPhongMaterial({color: 0x442200}));
                group.add(handle);
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.1), new THREE.MeshPhongMaterial({color: 0x888888}));
                head.position.set(0.15, 0.3, 0); group.add(head);
            }
            return group;
        }

        function createChar(isMe) {
            const g = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), new THREE.MeshPhongMaterial({color: isMe ? 0x3498db : 0xe74c3c}));
            b.position.y = 0.6; g.add(b);
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshPhongMaterial({color: 0xffdbac}));
            h.position.y = 1.4; g.add(h);
            const arm = new THREE.Group(); arm.position.set(0.5, 0.8, 0); g.add(arm);
            g.userData.weaponArm = arm;
            return g;
        }

        function createMob(type) {
            const g = new THREE.Group();
            let body;
            if (type === 'wolf') {
                body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.2), new THREE.MeshPhongMaterial({color: 0x777777}));
                body.position.y = 0.3; g.add(body);
            } else {
                body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.8), new THREE.MeshPhongMaterial({color: 0x553300}));
                body.position.y = 0.9; g.add(body);
            }
            g.userData.body = body;
            return g;
        }

        // --- Visual Effects ---
        socket.on('vfx', (data) => {
            if (data.type === 'damage') {
                const vector = new THREE.Vector3(data.x, 2, data.z);
                vector.project(camera);
                const x = (vector.x * .5 + .5) * window.innerWidth;
                const y = (vector.y * -.5 + .5) * window.innerHeight;
                const el = document.createElement('div');
                el.className = 'dmg-text';
                el.style.left = x + 'px'; el.style.top = y + 'px';
                el.innerText = "-" + data.amount;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 800);
            }
        });

        socket.on('state', (st) => {
            st.players.forEach(p => {
                if (!meshes.players[p.username]) { meshes.players[p.username] = createChar(p.username === myUsername); scene.add(meshes.players[p.username]); }
                const m = meshes.players[p.username]; m.targetPos = new THREE.Vector3(p.x, 0, p.z);
                m.userData.isGathering = p.isGathering; m.userData.isAttacking = p.isAttacking; m.visible = !p.dead;
                if (m.userData.currentWeapon !== p.weaponType) {
                    m.userData.weaponArm.clear();
                    if (p.weaponType) m.userData.weaponArm.add(createWeapon(p.weaponType));
                    m.userData.currentWeapon = p.weaponType;
                }
                if (p.username === myUsername) {
                    document.getElementById('hp-txt').innerText = `❤️ HP: ${Math.round(p.hp)} / ${p.maxHp}`;
                    document.getElementById('gold-txt').innerText = `💰 Gold: ${p.gold}`;
                }
            });
            
            const mobIds = st.monsters.map(m => m.id);
            Object.keys(meshes.monsters).forEach(id => { if(!mobIds.includes(id)) { scene.remove(meshes.monsters[id]); delete meshes.monsters[id]; } });
            st.monsters.forEach(m => {
                if (!meshes.monsters[m.id]) { meshes.monsters[m.id] = createMob(m.type); scene.add(meshes.monsters[m.id]); }
                const mesh = meshes.monsters[m.id];
                mesh.position.lerp(new THREE.Vector3(m.x, 0, m.z), 0.2);
                mesh.userData.id = m.id; mesh.userData.type = 'monster';
                mesh.userData.body.material.emissive.setHex(m.isHit ? 0xff0000 : 0x000000);
            });

            const resIds = st.resources.map(r => r.id);
            Object.keys(meshes.resources).forEach(id => { if(!resIds.includes(id)) { scene.remove(meshes.resources[id]); delete meshes.resources[id]; } });
            st.resources.forEach(r => {
                if (!meshes.resources[r.id]) {
                    const mesh = new THREE.Mesh(r.type === 'tree' ? new THREE.ConeGeometry(0.7, 2.5) : new THREE.DodecahedronGeometry(0.5), new THREE.MeshPhongMaterial({color: r.type === 'tree' ? 0x145a32 : 0x7f8c8d}));
                    mesh.position.set(r.x, r.type === 'tree' ? 1.25 : 0.25, r.z); mesh.userData = { id: r.id, type: 'resource' };
                    scene.add(mesh); meshes.resources[r.id] = mesh;
                }
            });
        });

        socket.on('inventory', (d) => {
            const grid = document.getElementById('inv-grid'); grid.innerHTML = '';
            d.inventory.forEach((it, i) => {
                const s = document.createElement('div'); s.className = 'slot';
                if (it.image) s.innerHTML = `<img src="${it.image}">`;
                s.onclick = () => { if(it.type === 'weapon') socket.emit('equipItem', it.uid); else if(confirm(`Sell ${it.name}?`)) socket.emit('sellItem', i); };
                grid.appendChild(s);
            });
            const s1 = document.getElementById('slot-1');
            if (d.equipment && d.equipment.weapon) s1.innerHTML = `<img src="${d.equipment.weapon.image}">`;
            else s1.innerHTML = '';
        });

        socket.on('gatheringStart', (d) => { document.getElementById('gather-ui').style.display = 'block'; document.getElementById('bar-fill').style.transition = `width ${d.duration}ms linear`; setTimeout(() => document.getElementById('bar-fill').style.width = '100%', 50); });
        socket.on('gatheringFinished', () => { document.getElementById('gather-ui').style.display = 'none'; document.getElementById('bar-fill').style.transition = 'none'; document.getElementById('bar-fill').style.width = '0%'; });
        socket.on('notice', (m) => { const n = document.getElementById('notice'); n.innerText = m; setTimeout(() => n.innerText = "", 2500); });

        function toggleShop() { const s = document.getElementById('shop-ui'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; }
        window.addEventListener('keydown', (e) => { if (e.key === 'b') document.getElementById('inv-ui').style.display = document.getElementById('inv-ui').style.display === 'none' ? 'block' : 'none'; if (e.key === 'p') toggleShop(); });
        
        window.addEventListener('mousedown', (e) => {
            if (e.target !== document.body && e.target.tagName !== 'CANVAS') return;
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, camera);
            const hits = ray.intersectObjects(scene.children, true);
            for(let h of hits) {
                let obj = h.object; while(obj.parent && !obj.userData.type) obj = obj.parent;
                if(obj.userData.type === 'resource') return socket.emit('startGathering', obj.userData.id);
                if(obj.userData.type === 'monster') return socket.emit('startAttack', obj.userData.id);
            }
            const gHit = ray.intersectObject(floor); if(gHit[0]) socket.emit('move', {x: ground[0].point.x, z: gHit[0].point.z});
        });

        function animate() {
            requestAnimationFrame(animate);
            Object.values(meshes.players).forEach(m => {
                if (m.targetPos) m.position.lerp(m.targetPos, 0.15);
                // ANIMATIONS
                if (m.userData.isAttacking) {
                    m.userData.weaponArm.rotation.x = Math.sin(Date.now() * 0.02) * 1.5; // Fast swing
                } else if (m.userData.isGathering) {
                    m.userData.weaponArm.rotation.x = Math.sin(Date.now() * 0.01) * 1.0; // Slow swing
                } else {
                    m.userData.weaponArm.rotation.x = 0;
                }
            });
            if (meshes.players[myUsername]) { const p = meshes.players[myUsername].position; camera.position.set(p.x, p.y + 20, p.z + 15); camera.lookAt(p.x, p.y, p.z); }
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
