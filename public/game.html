<!DOCTYPE html>
<html>
<head>
    <title>IronRealm - Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { 
            position: absolute; top: 20px; left: 20px; padding: 15px; 
            background: rgba(0,0,0,0.7); border-radius: 8px; color: white; 
            pointer-events: none; border: 1px solid #444;
        }
        #gather-ui { 
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); 
            display: none; width: 250px; text-align: center; 
        }
        #bar-bg { width: 100%; height: 12px; background: #222; border: 1px solid #fff; border-radius: 6px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #5a5; }
        #status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="status-msg">Connecting to Realm...</div>

    <div id="ui">
        <div id="hp">❤️ HP: Waiting for server...</div>
        <div style="font-size: 11px; color: #888; margin-top: 5px;">Click ground to move.<br>Click Trees/Rocks to gather.</div>
    </div>

    <div id="gather-ui">
        <div style="color:white; font-size: 12px; margin-bottom: 5px;">GATHERING...</div>
        <div id="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <script>
        const token = localStorage.getItem('ir_token');
        if (!token) { window.location.href = '/index.html'; }

        // --- Step 1: Identify Me ---
        let myUsername = "";
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            myUsername = payload.username;
            console.log("Logged in as:", myUsername);
        } catch (e) {
            console.error("Token Error");
            window.location.href = '/index.html';
        }

        // --- Step 2: Socket Setup ---
        const socket = io({ 
            auth: { token },
            reconnectionAttempts: 5
        });

        socket.on('connect', () => {
            console.log("Connected to server!");
            document.getElementById('status-msg').style.display = 'none';
        });

        socket.on('connect_error', (err) => {
            document.getElementById('status-msg').innerText = "Auth Error: Please Login Again";
            console.error("Socket Error:", err.message);
        });

        // --- Step 3: Three.js Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhongMaterial({color: 0x223322}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        const meshes = { players: {}, resources: {} };

        function createChar(color) {
            const g = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.4), new THREE.MeshPhongMaterial({color}));
            b.position.y = 0.6; g.add(b);
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({color: 0xffdbac}));
            h.position.y = 1.4; g.add(h);
            return g;
        }

        // --- Step 4: Logic ---
        socket.on('state', (state) => {
            state.players.forEach(p => {
                if (!meshes.players[p.username]) {
                    meshes.players[p.username] = createChar(p.username === myUsername ? 0x3366ff : 0xcc3333);
                    scene.add(meshes.players[p.username]);
                }
                const m = meshes.players[p.username];
                m.position.set(p.x, 0, p.z);
                m.userData.isGathering = p.isGathering;

                if (p.username === myUsername) {
                    document.getElementById('hp').innerText = `❤️ HP: ${Math.round(p.hp)} / ${p.maxHp}`;
                }
            });

            state.resources.forEach(res => {
                if (!meshes.resources[res.id]) {
                    const mesh = new THREE.Mesh(
                        res.type === 'tree' ? new THREE.ConeGeometry(0.6, 2) : new THREE.IcosahedronGeometry(0.5),
                        new THREE.MeshPhongMaterial({color: res.type === 'tree' ? 0x1a331a : 0x555555})
                    );
                    mesh.position.set(res.x, res.type === 'tree' ? 1 : 0.25, res.z);
                    mesh.userData = { id: res.id, type: 'resource' };
                    scene.add(mesh);
                    meshes.resources[res.id] = mesh;
                }
            });
        });

        socket.on('gatheringStart', (d) => {
            document.getElementById('gather-ui').style.display = 'block';
            const f = document.getElementById('bar-fill');
            f.style.transition = 'none'; f.style.width = '0%';
            setTimeout(() => { f.style.transition = `width ${d.duration}ms linear`; f.style.width = '100%'; }, 50);
        });
        socket.on('gatheringFinished', () => { document.getElementById('gather-ui').style.display = 'none'; });

        window.addEventListener('mousedown', (e) => {
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster();
            ray.setFromCamera(mouse, camera);
            const hits = ray.intersectObjects(scene.children);
            for(let h of hits) {
                if(h.object.userData.type === 'resource') return socket.emit('startGathering', h.object.userData.id);
            }
            const ground = ray.intersectObject(floor);
            if(ground[0]) socket.emit('move', {x: ground[0].point.x, z: groundHit = ground[0].point.z});
        });

        function animate() {
            requestAnimationFrame(animate);
            if (meshes.players[myUsername]) {
                const p = meshes.players[myUsername].position;
                camera.position.set(p.x, p.y + 15, p.z + 10);
                camera.lookAt(p.x, p.y, p.z);
            } else {
                camera.position.set(0, 20, 20); camera.lookAt(0,0,0);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
